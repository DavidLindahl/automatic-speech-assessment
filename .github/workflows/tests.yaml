name: CPU-safe checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check src/

      - name: Shell syntax check (jobs/)
        run: |
          set -e
          for f in $(find jobs -name '*.sh' -type f); do bash -n "$f"; done

      - name: Memory-budget linter
        run: bash jobs/_lib/lint-budget.sh
        continue-on-error: true  # known violations from before the firebreak landed

      - name: CPU-safe pytest subset
        run: |
          uv run pytest \
            tests/test_processed_data.py \
            tests/test_collator.py \
            tests/test_dataset.py \
            -q
