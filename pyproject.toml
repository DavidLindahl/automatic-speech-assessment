[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "salmonn-bench"
version = "0.1.0"
description = "Zero-shot SALMONN benchmarking for speech quality evaluation."
authors = [
  { name = "David Lindahl", email = "s234817@dtu.dk" },
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==0.20.3",
  "librosa>=0.10.2",
  "nltk>=3.8",
  "numpy<2.0.0",
  "pandas>=2.0.0",
  "peft==0.3.0",
  "pyyaml>=6.0.2",
  "scipy>=1.10.0",
  "sentencepiece==0.1.97",
  "soundfile>=0.12.1",
  "torch==2.0.1",
  "torchaudio==2.0.2",
  "transformers==4.28.0",
  "typer==0.15.1",
]

[project.scripts]
salmonn-bench = "salmonn_bench.cli:app"
